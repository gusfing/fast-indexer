# Nginx Reverse Proxy Configuration for Fast Indexer
# Save to /etc/nginx/sites-available/fast-indexer and link to sites-enabled

server {
    listen 80;
    server_name indexer.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name indexer.yourdomain.com;

    # SSL certificates (e.g. from certbot)
    # ssl_certificate /etc/letsencrypt/live/indexer.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/indexer.yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
